global_ai:
  api_key: ""
  base_url: "https://api.deepseek.com/"
  chat_model: "deepseek-chat"
  code_model: "deepseek-coder"
  frequency_penalty: 0.0
  presence_penalty: 0.0
  temperature: 1.1
  max_tokens: 1024
  stream: true

chat:
  role_system: "system"
  role_user: "user"
  role_assistant: "assistant"
  bot_qq: ""
  resp_index: 0
  group_msg_context_limit: 64
  group_word_context_limit: 2048
  send_interval: 1.5
  ai_name: "Miku"
  miku_prefix: 
    - "miku,"
    - "miku， "
    - "miku，"
    - "Miku, "
    - "Miku,"
    - "Miku， "
    - "Miku，"
  sys_prefix: 
    - "info"
    - "sts"
    - "statistic"
    - "stat"
  match_all_cmd: ""
  top_index: 0
  administor: ""
  friend_req: true

history_book:
  record_keywords: ["记", "记仇", "入典", "📸", "📝"]
  review_keywords: ["来点语录", "翻翻小本本", "随机黑历史", "随机迫害", "语录", "黑历史", "抽黑历史"]
  enable_poke: true

news:
  push_time: "08:30"
  push_groups: []

stock_push:
  push_time: "15:30"
  push_groups: []

voice:
  sovits_api_url: "http://tts-infer:3333"
  ref_audio_path: "/app/ref_audio/mika_zh.wav"
  ref_text: "万圣节快乐哦~☆听说今天商场有卖一日限定的饰品呢，老师要不要和我一起去购物呀？"
  ref_language: "zh"
  top_k: 15
  top_p: 1.0
  temperature: 1.0
  speed_factor: 1.0
  text_split_method: "cut0"
  max_segment_length: 50
  parallel_infer: false
